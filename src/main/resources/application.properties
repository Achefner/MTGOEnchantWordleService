quarkus.http.port=8081
quarkus.http.test-port=8091

# Upstream card database
quarkus.rest-client.mtgo-database.url=http://localhost:8080

# The front end (vite on :5173) calls this service from the browser
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=/.*/
%test.quarkus.http.cors.enabled=true
%test.quarkus.http.cors.origins=/.*/
